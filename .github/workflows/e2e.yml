name: Web E2E (Playwright)

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "supabase/**"
      - "scripts/seed-local-e2e.ts"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Start local Supabase and apply migrations
        run: |
          supabase start
          supabase db reset

      - name: Export local Supabase settings
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a
          . "$RUNNER_TEMP/supabase.env"
          set +a
          PASSWORD="$(openssl rand -hex 12)"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "::add-mask::$PASSWORD"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "E2E_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Seed E2E accounts (local stack only)
        run: pnpm seed:e2e

      - name: Install Playwright browser
        run: pnpm --filter @partner-os/web exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm --filter @partner-os/web e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
